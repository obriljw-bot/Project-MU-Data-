<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🖥️ 실시간 통합 프롬프터 대시보드</title>
    <script src="/nosleep.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #0f172a; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        /* Security Gate Overlay */
        #authGate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.98); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
        #authGate h1 { color: #3b82f6; margin-bottom: 20px; font-size: 3rem; }
        #authGate p { color: #94a3b8; font-size: 1.5rem; margin-bottom: 40px; padding: 0 40px; line-height: 1.5; }
        #pinInput { font-size: 6rem; width: 300px; text-align: center; padding: 15px; border-radius: 16px; border: 3px solid #334155; background: #1e293b; color: white; outline: none; letter-spacing: 10px; font-family: monospace; }
        #pinInput:focus { border-color: #3b82f6; }
        #pinBtn { margin-top: 40px; padding: 25px 60px; font-size: 2rem; background: #3b82f6; font-weight: 900; color: white; border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); cursor: pointer; }
        #pinBtn:active { transform: scale(0.95); }

        /* Top Bar Dashboard */
        .top-bar { 
            background: #1e293b; padding: 15px 30px; border-bottom: 4px solid #3b82f6; 
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 50;
        }
        .top-bar-section { display: flex; align-items: center; gap: 20px; }
        
        .stat-badge { background: #334155; padding: 10px 20px; border-radius: 12px; display: flex; align-items: center; gap: 15px; border: 1px solid #475569; }
        .stat-badge .label { color: #94a3b8; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; }
        .stat-badge .value { color: #facc15; font-size: 2rem; font-weight: 900; white-space: nowrap; }
        .stat-badge .value.money { color: #4ade80; }
        .stat-badge .value.viewers { color: #fb7185; }

        .title-area { font-size: 2rem; font-weight: 900; color: white; display: flex; gap: 10px; align-items: center;}
        .full-screen-btn { background: #3b82f6; border: none; color: white; padding: 8px 15px; font-size: 1rem; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Main Content 2-Column Grid */
        .main-wrapper { flex: 1; display: flex; overflow: hidden; }

        /* Left: Prompter Cues (65%) */
        .left-pane { flex: 0 0 65%; display: flex; flex-direction: column; overflow: hidden; }
        #cueContainer {
            flex: 1; padding: 40px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 30px; scroll-behavior: smooth;
        }
        
        .cue-item { padding: 40px; border-radius: 20px; background: #111827; border: 2px solid #374151; box-shadow: 0 10px 30px rgba(0,0,0,0.5); opacity: 0; transform: translateY(20px); animation: slideUp 0.4s forwards; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .cue-text { font-size: 3.5rem; font-weight: 900; color: #facc15; line-height: 1.4; word-break: keep-all; overflow-wrap: break-word; }
        
        .product-card { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); border-color: #4f46e5; text-align: center; }
        .product-name { font-size: 3rem; font-weight: 900; color: white; margin-bottom: 20px; }
        .stats-grid { display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 25px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-label-small { font-size: 1.2rem; color: #818cf8; margin-bottom: 10px; font-weight: bold; }
        .stat-value-large { font-size: 3.5rem; font-weight: 900; color: white; }
        .stat-value-large.highlight { color: #fca5a5; }

        /* Right: Live Chat (35%) */
        #chatContainer {
            flex: 0 0 35%; background: #020617; border-left: 2px solid #334155; 
            display: flex; flex-direction: column; overflow: hidden;
        }
        .chat-header { background: #0f172a; padding: 15px; font-size: 1.5rem; font-weight: bold; text-align: center; color: #60a5fa; border-bottom: 2px solid #1e293b; }
        #chatList { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
        
        .chat-bubble { background: #1e293b; padding: 15px 20px; border-radius: 12px; border-left: 4px solid #3b82f6; animation: fadeIn 0.3s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .chat-nick { font-size: 1.2rem; font-weight: bold; color: #94a3b8; margin-bottom: 5px; }
        .chat-msg { font-size: 1.5rem; color: white; line-height: 1.4; word-break: break-all; white-space: pre-wrap; }

        .system-msg { text-align: center; color: #6b7280; font-size: 2rem; font-weight: bold; margin-top: 50px; }

        /* 채팅/TOP정보 탭 */
        .chat-tabbar { display: flex; background: #0f172a; border-bottom: 2px solid #1e293b; flex: none; }
        .chat-tab-btn { flex: 1; padding: 12px; font-size: 1.15rem; font-weight: bold; background: transparent; color: #64748b; border: none; border-bottom: 3px solid transparent; cursor: pointer; }
        .chat-tab-btn.active { color: #60a5fa; border-bottom-color: #3b82f6; }

        #topPanel { flex: 1; overflow-y: auto; padding: 20px; display: none; flex-direction: column; gap: 25px; }
        .top-section-header { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; color: #facc15; margin-bottom: 10px; }
        .top-sort-toggle { margin-left: auto; display: flex; gap: 6px; }
        .top-sort-btn { font-size: 0.9rem; font-weight: bold; padding: 5px 12px; border-radius: 14px; border: 1px solid #334155; background: #1e293b; color: #6b7280; cursor: pointer; }
        .top-sort-btn.active { background: #a16207; color: #fff; border-color: #ca8a04; }

        .top-row { display: flex; flex-direction: column; gap: 6px; background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
        .top-row-main { display: flex; align-items: center; gap: 10px; }
        .top-rank { font-size: 1.4rem; font-weight: 900; width: 26px; text-align: center; color: #6b7280; flex: none; font-family: monospace; }
        .top-rank.r1 { color: #facc15; } .top-rank.r2 { color: #cbd5e1; } .top-rank.r3 { color: #d97706; }
        .top-name { flex: 1; font-weight: bold; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: monospace; }
        .top-stats-line { display: flex; justify-content: flex-end; align-items: baseline; gap: 16px; padding-left: 36px; }
        .top-qty { font-size: 1.1rem; font-weight: 900; color: #f87171; flex: none; white-space: nowrap; font-family: monospace; }
        .top-rev { font-size: 0.95rem; font-weight: 900; color: #facc15; flex: none; white-space: nowrap; font-family: monospace; }
        .kw-row { margin-bottom: 12px; border-radius: 8px; padding: 4px 6px; }
        .kw-top-line { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .kw-term { font-size: 1.15rem; font-weight: bold; color: #e5e7eb; font-family: monospace; }
        .kw-freq { font-size: 0.95rem; color: #9ca3af; font-family: monospace; }

        /* [실제 구매신호] 제품코드/제품명/브랜드가 언급된 핫키워드 — 상시 표시 없이,
           신규 진입 순간에만 ✨ 아이콘이 3번 반짝이고 완전히 사라짐 (골드 테두리 없음) */
        .match-spark { display: inline-block; animation: sparkBlink3 0.5s ease-in-out 3; animation-fill-mode: forwards; }
        @keyframes sparkBlink3 { 0%, 100% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }

        /* [신규 진입] TOP5에 새로 들어온 항목 — 잠깐 튀는 하이라이트 */
        @keyframes newEntryPop {
            0% { transform: scale(0.94); box-shadow: 0 0 0 rgba(96,165,250,0); }
            35% { transform: scale(1.035); box-shadow: 0 0 22px rgba(96,165,250,0.65); }
            100% { transform: scale(1); box-shadow: 0 0 0 rgba(96,165,250,0); }
        }
        .new-entry { animation: newEntryPop 1.1s ease-out; }
        .new-badge {
            display: inline-block; font-size: 0.65rem; font-weight: 900; color: #0f172a;
            background: #60a5fa; border-radius: 6px; padding: 2px 6px; margin-left: 8px;
            letter-spacing: 1px; vertical-align: middle; animation: newEntryPop 1.1s ease-out;
        }
        /* [판매TOP5 신규진입] 화면 전체를 덮는 블러 배경 위에 큼직한 가로형 배너로 노출된 뒤
           리스트 쪽 신규진입 효과로 흡수됨 — 뒷배경은 흐릿하게, 배너는 화면 좌우 꽉 차게 */
        .top-entry-popup {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            padding: 0 5vw;
            pointer-events: none; opacity: 0; z-index: 500;
            background: rgba(10,15,28,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.35s ease;
        }
        .top-entry-popup.show { opacity: 1; }
        .top-entry-popup-card {
            width: 100%; box-sizing: border-box;
            background: #1e293b; border: 4px solid #facc15; border-radius: 28px;
            padding: 56px 60px; text-align: center; box-shadow: 0 0 70px rgba(250,204,21,0.55);
            transform: scale(0.88); transition: transform 0.35s ease;
        }
        .top-entry-popup.show .top-entry-popup-card { transform: scale(1); }
        .top-entry-popup-label { color: #facc15; font-size: 2.6rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 18px; text-transform: uppercase; font-family: sans-serif; }
        .top-entry-popup-name { color: white; font-size: 5.5rem; font-weight: 900; font-family: monospace; line-height: 1.15; word-break: keep-all; overflow-wrap: break-word; }

        .kw-bar-bg { height: 8px; background: #1f2937; border-radius: 4px; overflow: hidden; }
        .kw-bar-fill { height: 100%; background: #3b82f6; border-radius: 4px; }
        .top-empty { text-align: center; color: #4b5563; font-size: 1rem; padding: 20px 0; }

        /* ══════════════════════════════════════════════
           TV/모니터 모드 (?tv=1) — 터치 불가 순수 디스플레이용
           3분할: 상품정보+통계 / 판매TOP5+핫키워드TOP5 / 채팅(확장)
           영상은 완전히 별도의 창 — 이 페이지 안에는 자리를 만들지 않음.
           동일 URL, body.tv-mode 클래스로만 분기 (별도 파일 없음)
           ══════════════════════════════════════════════ */
        body.tv-mode .chat-tabbar,
        body.tv-mode #chatModeRow,
        body.tv-mode .full-screen-btn,
        body.tv-mode #wakeLockBadge {
            display: none !important;
        }
        body.tv-mode .left-pane { flex: 0 0 44%; }
        /* chatContainer를 가로 배치로 바꿔 TOP5 컬럼 + 채팅 컬럼으로 분리.
           DOM 순서는 chatList가 topPanel보다 먼저라 order로 시각 순서만 뒤집음
           (topPanel = 가운데 구 영상자리, chatList = 오른쪽 확장) */
        body.tv-mode #chatContainer { flex: 1; flex-direction: row; }
        body.tv-mode #topPanel {
            display: flex !important; flex: 0 0 44%; flex-direction: column;
            border-right: 2px solid #1e293b; order: 1;
        }
        body.tv-mode #chatList { flex: 1; order: 2; }

        /* TV모드 채팅: 폰트/메시지박스 기존 대비 20% 확대 */
        body.tv-mode #chatList { padding: 14px; gap: 10px; }
        body.tv-mode .chat-bubble { padding: 10px 14px; }
        body.tv-mode .chat-nick { font-size: 0.96rem; margin-bottom: 2px; }
        body.tv-mode .chat-msg { font-size: 1.14rem; line-height: 1.3; }

    </style>
</head>
<body>

    <div id="topEntryPopup" class="top-entry-popup">
        <div class="top-entry-popup-card">
            <div class="top-entry-popup-label">신규 TOP5 진입</div>
            <div class="top-entry-popup-name" id="topEntryPopupName"></div>
        </div>
    </div>

    <!-- AUTH GATEWAY -->
    <div id="authGate">
        <h1>🔐 대시보드 보안 연결</h1>
        <p>비인가자의 방송 데이터 탈취를 막기 위해 보안 연결을 사용합니다.<br><br>PC 주 화면에 표시된 <b>일회성 보안 PIN 4자리</b>를 입력하세요.</p>
        <input type="number" id="pinInput" placeholder="0000" maxlength="4" />
        <button id="pinBtn">인증 후 대시보드 열기</button>
    </div>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div></div> <!-- Spacer -->
        <div class="title-area">
            🔴 LIVE PROMPTER
            <button class="full-screen-btn" onclick="toggleFullScreen()">⛶</button>
            <span id="wakeLockBadge" style="font-size:1rem; padding: 6px 14px; border-radius: 20px; background:#1e293b; border: 1px solid #334155; color:#6b7280; font-weight:bold;">💤 화면유지 대기</span>
        </div>
        <div></div> <!-- Spacer -->
    </div>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <!-- LEFT: CUE & STATS -->
        <div class="left-pane">
            <div id="cueContainer">
                <div class="system-msg">서버 데이터를 연결 중입니다...</div>
            </div>

            <!-- GLOBAL STATS (BOTTOM FIXED) -->
            <div style="background: rgba(17, 24, 39, 1); border-top: 2px solid #334155; padding: 25px 40px; display: flex; justify-content: center; gap: 30px; align-items: center; z-index: 10;">
                <div class="stat-badge" style="flex: 1; background: rgba(17, 24, 39, 0.9); border: 1px solid #facc15; box-shadow: 0 5px 15px rgba(250,204,21,0.2); border-radius: 12px; padding: 15px 30px;">
                    <span class="label" style="color: #facc15;">TOTAL SOLD</span>
                    <span class="value" id="topTotalSold" style="font-size: 2.8rem; color: #facc15; font-family: monospace;">0개</span>
                </div>
                <div class="stat-badge" style="flex: 1; background: rgba(17, 24, 39, 0.9); border: 1px solid #facc15; box-shadow: 0 5px 15px rgba(250,204,21,0.2); border-radius: 12px; padding: 15px 30px;">
                    <span class="label" style="color: #facc15;">TOTAL REVENUE</span>
                    <span class="value money" id="topTotalRevenue" style="font-size: 2.8rem; color: #facc15; font-family: monospace;">₩0</span>
                </div>
            </div>
        </div>

        <!-- RIGHT: CHAT / TOP INFO -->
        <div id="chatContainer">
            <div class="chat-tabbar">
                <button id="tabChatBtn" class="chat-tab-btn active">💬 실시간 채팅</button>
                <button id="tabTopBtn" class="chat-tab-btn">🏆 TOP 정보</button>
            </div>
            <div class="chat-header" style="display:flex; align-items:center; justify-content:center; position:relative;" id="chatModeRow">
                <button id="chatModeBtn" style="position:absolute; right:15px; font-size:0.9rem; font-weight:bold; padding:5px 14px; border-radius:20px; border:1px solid #334155; background:#1e293b; color:#6b7280; cursor:pointer;">📋 일반모드</button>
            </div>
            <div id="chatList"></div>

            <div id="topPanel">
                <div>
                    <div class="top-section-header">
                        판매 TOP 5
                        <div class="top-sort-toggle">
                            <button id="topSortQtyBtn" class="top-sort-btn">수량</button>
                            <button id="topSortRevBtn" class="top-sort-btn active">매출</button>
                        </div>
                    </div>
                    <div id="topProductsList"></div>
                </div>
                <div>
                    <div class="top-section-header">
                        핫키워드 TOP 5
                        <div class="top-sort-toggle">
                            <button id="topKwQueryBtn" class="top-sort-btn active">문의</button>
                            <button id="topKwReactionBtn" class="top-sort-btn">반응</button>
                        </div>
                    </div>
                    <div id="topKeywordsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TV/모니터 모드: 같은 URL에 ?tv=1 만 붙이면 터치 없는 순수 디스플레이용 레이아웃으로 전환
        // (탭 전환 UI 숨김 + 채팅/TOP정보 동시 표시). 별도 파일 없이 CSS 분기로만 처리.
        const isTvMode = new URLSearchParams(location.search).get('tv') === '1';
        if (isTvMode) document.body.classList.add('tv-mode');

        const authGate = document.getElementById('authGate');
        const pinInput = document.getElementById('pinInput');
        const pinBtn = document.getElementById('pinBtn');
        const cueContainer = document.getElementById('cueContainer');
        const chatList = document.getElementById('chatList');
        
        // Stats DOM
        const topTotalSold = document.getElementById('topTotalSold');
        const topTotalRevenue = document.getElementById('topTotalRevenue');

        let ws;
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws-signal`;

        // TV모드 전용 자동 인증: 메인 대시보드가 PIN을 가져올 때 쓰는 것과 동일한
        // 로컬 전용(127.0.0.1) 엔드포인트를 그대로 재사용 — 서버 보안 로직은 그대로 두고
        // "같은 PC에서 열림"을 이용해 PIN 입력 화면만 건너뜀.
        async function autoAuthForTv() {
            try {
                const res = await fetch('http://localhost:8081/admin/pin');
                if (!res.ok) throw new Error('local only');
                const data = await res.json();
                if (data.pin) {
                    ws.send(JSON.stringify({ type: 'AUTH', pin: data.pin }));
                    return;
                }
                throw new Error('no pin');
            } catch (e) {
                // 로컬이 아니거나 실패 시 안전하게 수동 PIN 화면 노출
                authGate.style.display = 'flex';
            }
        }

        function connectWS() {
            ws = new WebSocket(wsUrl);
            ws.onopen = () => console.log('✅ WS Server Connected');
            
            ws.onmessage = (event) => {
                try {
                    const payload = JSON.parse(event.data);
                    
                    if (payload.type === 'PING') {
                        ws.send(JSON.stringify({ type: 'PONG' }));
                        return;
                    }

                    if (payload.type === 'AUTH_REQUIRED') {
                        if (isTvMode) {
                            // TV모드는 외부 접속이 아니라 같은 PC(HDMI로 연결된 모니터)에서만 열리므로
                            // 매번 PIN을 물어보지 않고 로컬 전용 /admin/pin에서 직접 받아 자동 인증.
                            // (이 엔드포인트는 서버가 127.0.0.1 요청에만 응답 — 외부 접속이면 실패해 안전하게 게이트 노출)
                            autoAuthForTv();
                            return;
                        }
                        // [단순화] 자동 재인증 제거 — PIN은 서버 재시작마다 바뀌므로
                        // 저장된 옛날 값을 조용히 재시도하다 실패하는 대신, 매번 명확하게 입력받음
                        authGate.style.display = 'flex';
                    }
                    if (payload.type === 'AUTH_SUCCESS') {
                        authGate.style.display = 'none';
                        cueContainer.innerHTML = '<div class="system-msg">대기 중... 방송을 시작하세요.</div>';
                    }
                    if (payload.type === 'AUTH_FAILED') {
                        authGate.style.display = 'flex';
                        alert("❌ 보안 인증 실패: 비밀번호를 다시 확인하세요.");
                        pinInput.value = '';
                        pinInput.focus();
                    }
                    if (payload.type === 'SHOW_CUE') {
                        renderCue(payload.data);
                    }
                    // 실시간 시청자 채팅 (스니퍼 → 서버 → 전체 브로드캐스트)
                    if (payload.type === 'CHAT_MSG' || payload.type === 'SALES_UPDATE') {
                        renderChat(payload.data);
                    }
                    if (payload.type === 'SYNC_GLOBAL_STATS') {
                        updateGlobalStats(payload.data);
                    }
                    // 봇/시스템 메시지 (SNIFFER_LOG, BOT_REPLY)
                    if (payload.type === 'SNIFFER_LOG' || payload.type === 'BOT_REPLY') {
                        renderChat({ nickname: '🤖 시스템', message: payload.data.message || payload.data.replyText, isSystem: true });
                    }
                    // 선착순 판매 종료 — 메인 대시보드와 동일한 봇 메시지 표시
                    if (payload.type === 'FCFS_WINNERS') {
                        const count = payload.data?.count ?? 0;
                        renderChat({ nickname: '🤖 BOT', message: `📢 [판매종료] 당첨자 ${count}명 집계 완료!`, isSystem: true });
                    }
                    // 판매 TOP5 / 핫키워드 TOP5 — 메인 대시보드가 계산한 결과를 그대로 수신해 표시
                    if (payload.type === 'TOP_STATS_SYNC') {
                        latestTopStats = payload.data || { topProducts: [], keywordsQuery: [], keywordsReaction: [] };
                        renderTopProducts();
                        renderTopKeywords();
                    }
                } catch (e) {}
            };

            ws.onclose = () => {
                cueContainer.innerHTML = '<div class="system-msg" style="color:#ef4444;">서버 연결 끊김. 재연결 중...</div>';
                setTimeout(connectWS, 3000);
            };
        }

        // 순수채팅모드: 시스템/선착순 안내/봇 메시지 제외하고 사람 채팅만 표시
        const chatModeBtn = document.getElementById('chatModeBtn');
        let chatViewMode = localStorage.getItem('prompter_chat_mode') || 'PURE';

        function applyChatModeStyle() {
            if (chatViewMode === 'PURE') {
                chatModeBtn.textContent = '👤 순수채팅';
                chatModeBtn.style.background = '#064e3b';
                chatModeBtn.style.color = '#86efac';
                chatModeBtn.style.borderColor = '#15803d';
            } else {
                chatModeBtn.textContent = '📋 일반모드';
                chatModeBtn.style.background = '#1e293b';
                chatModeBtn.style.color = '#6b7280';
                chatModeBtn.style.borderColor = '#334155';
            }
        }
        applyChatModeStyle();

        chatModeBtn.addEventListener('click', () => {
            chatViewMode = (chatViewMode === 'PURE') ? 'NORMAL' : 'PURE';
            localStorage.setItem('prompter_chat_mode', chatViewMode);
            applyChatModeStyle();
        });

        // ── 💬 채팅 / 🏆 TOP 정보 탭 전환 ──────────────────────────────
        const tabChatBtn = document.getElementById('tabChatBtn');
        const tabTopBtn = document.getElementById('tabTopBtn');
        const chatModeRow = document.getElementById('chatModeRow');
        const topPanel = document.getElementById('topPanel');

        function switchChatTab(mode) {
            const isChat = mode === 'CHAT';
            tabChatBtn.classList.toggle('active', isChat);
            tabTopBtn.classList.toggle('active', !isChat);
            chatModeRow.style.display = isChat ? 'flex' : 'none';
            chatList.style.display = isChat ? 'flex' : 'none';
            topPanel.style.display = isChat ? 'none' : 'flex';
        }
        tabChatBtn.addEventListener('click', () => switchChatTab('CHAT'));
        tabTopBtn.addEventListener('click', () => switchChatTab('TOP'));

        // ── 🏆 TOP 정보: 판매 TOP5 / 핫키워드 TOP5 렌더링 ───────────────
        // 집계 로직(STOPWORDS·조사처리 등)은 메인 대시보드에서만 계산되고,
        // 여기서는 TOP_STATS_SYNC로 받은 결과를 정렬/표시만 함 (로직 중복 없음).
        let latestTopStats = { topProducts: [], keywordsQuery: [], keywordsReaction: [] };
        let topSortMode = 'REV';   // 'QTY' | 'REV' — 기본: 매출 기준 정렬
        let topKwMode = 'QUERY';   // 'QUERY' | 'REACTION'

        const topProductsList = document.getElementById('topProductsList');
        const topKeywordsList = document.getElementById('topKeywordsList');
        const topSortQtyBtn = document.getElementById('topSortQtyBtn');
        const topSortRevBtn = document.getElementById('topSortRevBtn');
        const topKwQueryBtn = document.getElementById('topKwQueryBtn');
        const topKwReactionBtn = document.getElementById('topKwReactionBtn');

        function rankClass(idx) {
            return idx === 0 ? 'r1' : idx === 1 ? 'r2' : idx === 2 ? 'r3' : '';
        }

        // TOP5에 새로 진입한 항목을 감지해 반짝 강조하기 위한 직전 렌더 키 목록
        let prevTopProductKeys = new Set();
        let prevKeywordKeys = { QUERY: new Set(), REACTION: new Set() };

        function renderTopProducts() {
            const sorted = [...latestTopStats.topProducts]
                .sort((a, b) => topSortMode === 'QTY'
                    ? (b.sales || 0) - (a.sales || 0)
                    : ((b.sales || 0) * (b.price || 0)) - ((a.sales || 0) * (a.price || 0)))
                .slice(0, 5);

            if (sorted.length === 0) {
                topProductsList.innerHTML = '<div class="top-empty">판매 기록 없음</div>';
                prevTopProductKeys = new Set();
                return;
            }
            // 이름이 길어도 줄바꿈하지 않고 셀 폭에 맞춰 폰트를 줄여서 한 줄로 표시
            const nameFitSize = (name) => {
                const len = (name || '').length;
                return len <= 10 ? 1.2 : len <= 16 ? 1.05 : len <= 22 ? 0.9 : 0.78;
            };
            const currentKeys = new Set(sorted.map(p => p.code || p.name));
            let firstNewName = null;
            topProductsList.innerHTML = sorted.map((p, idx) => {
                const key = p.code || p.name;
                const isNew = !prevTopProductKeys.has(key);
                if (isNew && !firstNewName) firstNewName = p.name || '';
                return `
                <div class="top-row ${isNew ? 'new-entry' : ''}">
                    <div class="top-row-main">
                        <span class="top-rank ${rankClass(idx)}">${idx + 1}</span>
                        <span class="top-name" style="font-size:${nameFitSize(p.name)}rem;">${p.name || ''}</span>
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                    </div>
                    <div class="top-stats-line">
                        <span class="top-qty">${(p.sales || 0).toLocaleString()}개</span>
                        <span class="top-rev">₩${((p.sales || 0) * (p.price || 0)).toLocaleString()}</span>
                    </div>
                </div>`;
            }).join('');
            prevTopProductKeys = currentKeys;
            if (firstNewName) showTopEntryPopup(firstNewName);
        }

        // 판매TOP5 신규 진입 시 화면 중앙에 잠깐 떴다가, 리스트 쪽 신규진입 효과로 흡수됨
        let topEntryPopupTimer = null;
        function showTopEntryPopup(name) {
            const popup = document.getElementById('topEntryPopup');
            const nameEl = document.getElementById('topEntryPopupName');
            nameEl.textContent = name;
            // 배너가 커진 만큼, 제품명이 길어지면 잘리지 않게 폰트를 줄임
            const len = (name || '').length;
            nameEl.style.fontSize = len <= 14 ? '5.5rem' : len <= 22 ? '4.2rem' : len <= 32 ? '3.2rem' : '2.4rem';
            popup.classList.add('show');
            if (topEntryPopupTimer) clearTimeout(topEntryPopupTimer);
            topEntryPopupTimer = setTimeout(() => popup.classList.remove('show'), 900);
        }

        function renderTopKeywords() {
            const list = (topKwMode === 'QUERY' ? latestTopStats.keywordsQuery : latestTopStats.keywordsReaction) || [];
            if (list.length === 0) {
                topKeywordsList.innerHTML = '<div class="top-empty">데이터 없음</div>';
                prevKeywordKeys[topKwMode] = new Set();
                return;
            }
            const maxFreq = list[0]?.frequency || 1;
            const currentKeys = new Set(list.map(t => t.term));
            const prevKeys = prevKeywordKeys[topKwMode];
            topKeywordsList.innerHTML = list.map((t, idx) => {
                // 신규진입 팝 효과·✨ 반짝임은 구매신호(제품/코드/브랜드 매칭) 키워드가
                // 새로 들어온 그 순간에만 재생되고, 상시 표시(테두리 등)는 없음
                const isNew = t.isProductMatch && !prevKeys.has(t.term);
                const rowClass = `kw-row ${isNew ? 'new-entry' : ''}`;
                return `
                <div class="${rowClass}">
                    <div class="kw-top-line">
                        <span class="kw-term">${idx + 1}. ${t.term}${isNew ? ' <span class="match-spark">✨</span>' : ''}</span>
                        <span class="kw-freq">${t.frequency}</span>
                    </div>
                    <div class="kw-bar-bg"><div class="kw-bar-fill" style="width:${Math.min((t.frequency / maxFreq) * 100, 100)}%"></div></div>
                </div>`;
            }).join('');
            prevKeywordKeys[topKwMode] = currentKeys;
        }

        topSortQtyBtn.addEventListener('click', () => {
            topSortMode = 'QTY';
            topSortQtyBtn.classList.add('active'); topSortRevBtn.classList.remove('active');
            renderTopProducts();
        });
        topSortRevBtn.addEventListener('click', () => {
            topSortMode = 'REV';
            topSortRevBtn.classList.add('active'); topSortQtyBtn.classList.remove('active');
            renderTopProducts();
        });
        topKwQueryBtn.addEventListener('click', () => {
            topKwMode = 'QUERY';
            topKwQueryBtn.classList.add('active'); topKwReactionBtn.classList.remove('active');
            renderTopKeywords();
        });
        topKwReactionBtn.addEventListener('click', () => {
            topKwMode = 'REACTION';
            topKwReactionBtn.classList.add('active'); topKwQueryBtn.classList.remove('active');
            renderTopKeywords();
        });

        // 자릿수가 늘어나도 박스 폭 안에서 줄바뀜 없이 한 줄로 들어오도록 길이 기반 폰트 축소
        function fitStatFontSize(len) {
            return len <= 7 ? 2.8 : len <= 10 ? 2.3 : len <= 13 ? 1.9 : 1.5;
        }
        function updateGlobalStats(data) {
            const soldText = `${data.totalSold.toLocaleString()}개`;
            const revText = `₩${data.totalRevenue.toLocaleString()}`;
            topTotalSold.innerText = soldText;
            topTotalSold.style.fontSize = `${fitStatFontSize(soldText.length)}rem`;
            topTotalRevenue.innerText = revText;
            topTotalRevenue.style.fontSize = `${fitStatFontSize(revText.length)}rem`;
        }

        function renderChat(data) {
            if (!data || !data.message) return;

            // ── 순수채팅모드: 시스템/선착순 안내/봇 메시지 제외 ──────────
            // data.isSystem: 프롬프터 자체가 만든 봇 메시지(SNIFFER_LOG/BOT_REPLY/FCFS_WINNERS)
            // data.nickname === 'SYSTEM': 그립 플랫폼이 보내는 선착순 안내 등 (스니퍼가 nick="SYSTEM"으로 전달)
            if (chatViewMode === 'PURE' && (data.isSystem || data.nickname === 'SYSTEM')) return;

            // ── 선착순 참여 메시지 필터 ──────────────────────────────────
            // 시스템/봇 메시지는 항상 표시. 일반 시청자 채팅 중 단순 참여
            // 메시지("저요", "1개" 등)는 태블릿에서 필터링해 가독성을 높임.
            if (!data.isSystem) {
                const msg = data.message.trim();
                // 순수 참여 메시지 패턴: "저요" / "저요!!!" / "ㅈㅛ" / "1" / "1개" / "2개" 등
                const participationOnly = /^[ㄱ-ㅎㅏ-ㅣ가-힣a-zA-Z]*저요[!~\s]*$|^ㅈ[ㅛ요][!~\s]*$|^\d+\s*개?$|^저[!\s]*$/;
                // 플랫폼 집계형 참여 문구: "OOO님 외 N명이 저요!" / "OOO님 외 N명이 추첨에 참여했습니다." 등
                // 닉네임에 공백이 섞인 경우("행복한 날들만 가득님" 등)도 잡히도록 님/외/명이 패턴으로 매칭
                const aggregateParticipation = /(님\s*외\s*\d+\s*명이\s*저요[!~\s]*$)|(님\s*외\s*\d+\s*명이\s*추첨에\s*참여했습니다\.?\s*$)|(^추첨에\s*참여했습니다\.?\s*$)/;
                if (participationOnly.test(msg) || aggregateParticipation.test(msg)) return;
            }

            const div = document.createElement('div');
            div.className = 'chat-bubble';
            if(data.isSystem) div.style.borderLeftColor = '#facc15';

            div.innerHTML = `
                <div class="chat-nick" ${data.isSystem ? 'style="color:#facc15"' : ''}>${data.nickname}</div>
                <div class="chat-msg" ${data.isSystem ? 'style="color:#fff"' : ''}>${data.message}</div>
            `;
            chatList.appendChild(div);

            while (chatList.children.length > 50) {
                chatList.removeChild(chatList.firstChild);
            }
            chatList.scrollTop = chatList.scrollHeight;
        }

        function renderCue(data) {
            // [V4.4] Clear previous content to act as a single popup/replacing view
            cueContainer.innerHTML = '';

            const div = document.createElement('div');
            div.className = 'cue-item';

            if (data.mode === 'TEXT') {
                div.innerHTML = `<div class="cue-text" style="font-size: 5rem; text-align: center; padding: 40px 0;">${data.text}</div>`;
            } else if (data.mode === 'PRODUCT') {
                const p = data.product;
                const sales = p.sales || 0;
                const stock = p.stock || 0;
                const remaining = stock - sales;
                const revAmount = p.price ? p.price * sales : 0;
                
                const price = p.price ? p.price.toLocaleString() : '-';
                const expiry = p.expiry || '-';
                const revenue = p.price ? revAmount.toLocaleString() : '-';

                div.classList.add('product-card');
                div.style.background = 'transparent';
                div.style.border = 'none';
                div.style.boxShadow = 'none';
                div.style.padding = '0';

                // 제품명이 길면(공백 없는 한글 특성상 줄바꿈이 안 될 수 있어 overflow-wrap 필수)
                // 폰트를 미리 줄여 최대 2줄 내로 들어오게 함 — 가격/재고 정보가 밀려 내려가는 것 방지
                const nameLen = (p.name || '').length;
                const nameFontSize = nameLen <= 12 ? 3.8 : nameLen <= 20 ? 3.0 : nameLen <= 30 ? 2.4 : 1.9;

                // 가격/유통기한/재고/매출 등 값 텍스트도 길어지면 줄바꿈하지 않고
                // 셀 폭에 맞춰 폰트를 줄여서 한 줄로 표시 (날짜, 큰 금액 등)
                const fitValueSize = (text, base) => {
                    const len = String(text).length;
                    if (len <= 6) return base;
                    if (len <= 9) return base * 0.82;
                    if (len <= 12) return base * 0.68;
                    return base * 0.55;
                };
                const priceSize = fitValueSize(price, 2.8);
                const expirySize = fitValueSize(expiry, 2.8);
                const stockSize = fitValueSize(stock, 2.8);
                const salesSize = fitValueSize(sales, 2.8);
                const remainingSize = fitValueSize(remaining, 2.8);
                const revenueSize = fitValueSize(revenue, 3.5);

                div.innerHTML = `
                    <div style="font-size: ${nameFontSize}rem; font-weight: 900; color: white; text-align: left; margin-bottom: 20px; line-height: 1.3; word-break: keep-all; overflow-wrap: break-word; max-height: 2.6em; overflow: hidden;">
                        <span style="color: #facc15; font-family: monospace; font-size: ${nameFontSize * 0.74}rem; margin-right: 14px; opacity: 0.9;">[${p.code || '-'}]</span>${p.name}
                    </div>

                    <div style="background: rgba(17, 24, 39, 0.9); border: 1px solid #4b5563; border-radius: 15px; padding: 20px 40px; margin-bottom: 20px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="color: #9ca3af; font-size: 1.8rem; font-family: sans-serif; font-weight: bold;">PRICE</span>
                            <span style="color: white; font-size: ${priceSize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">${price}</span>
                        </div>
                        <div style="width: 2px; height: 40px; background: #4b5563;"></div>
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <span style="color: #9ca3af; font-size: 1.8rem; font-family: sans-serif; font-weight: bold;">EXP</span>
                            <span style="color: #f472b6; font-size: ${expirySize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">${expiry}</span>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        <div style="background: rgba(17, 24, 39, 0.9); border: 1px solid #4b5563; padding: 15px 25px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                            <div style="color: #9ca3af; font-size: 1.2rem; font-family: sans-serif; font-weight: bold; margin-bottom: 6px; letter-spacing: 2px;">STOCK</div>
                            <div style="color: #d1d5db; font-size: ${stockSize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">${stock}</div>
                        </div>
                        <div style="background: rgba(17, 24, 39, 0.9); border: 1px solid #4b5563; padding: 15px 25px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                            <div style="color: #9ca3af; font-size: 1.2rem; font-family: sans-serif; font-weight: bold; margin-bottom: 6px; letter-spacing: 2px;">SOLD</div>
                            <div style="color: #ef4444; font-size: ${salesSize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">${sales}</div>
                        </div>
                        <div style="background: rgba(17, 24, 39, 0.9); border: 2px solid #60a5fa; padding: 15px 25px; border-radius: 15px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 25px rgba(59,130,246,0.3);">
                            <div style="color: #60a5fa; font-size: 1.2rem; font-family: sans-serif; font-weight: bold; margin-bottom: 6px; letter-spacing: 2px;">REM</div>
                            <div style="color: #60a5fa; font-size: ${remainingSize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">${remaining}</div>
                        </div>
                        <div style="grid-column: span 3; background: rgba(17, 24, 39, 0.9); border: 1px solid #facc15; padding: 18px 25px; border-radius: 15px; display: flex; align-items: center; justify-content: center; gap: 30px; box-shadow: 0 10px 25px rgba(250,204,21,0.2); margin-top: 5px;">
                            <span style="color: #facc15; font-size: 1.8rem; font-family: sans-serif; font-weight: bold;">TOTAL REVENUE</span>
                            <span style="color: #facc15; font-size: ${revenueSize}rem; font-weight: bold; font-family: monospace; white-space: nowrap;">₩${revenue}</span>
                        </div>
                    </div>
                `;
            }

            cueContainer.appendChild(div);
            
            // Re-apply entrance animation
            div.style.animation = 'none';
            setTimeout(() => div.style.animation = 'slideUp 0.4s forwards', 10);
        }

        pinBtn.addEventListener('click', () => {
            const pin = pinInput.value.trim();
            if (pin.length < 4) { alert('4자리 숫자를 입력하세요.'); return; }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'AUTH', pin: pin }));
            }
        });

        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') pinBtn.click();
        });

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`오류: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        connectWS();

        // ── 화면 자동꺼짐 방지 (NoSleep.js) ────────────────────────────
        const wakeLockBadge = document.getElementById('wakeLockBadge');
        const noSleep = new NoSleep();
        let noSleepEnabled = false;

        const enableNoSleep = () => {
            if (noSleepEnabled) return;
            noSleep.enable().then(() => {
                noSleepEnabled = true;
                wakeLockBadge.textContent = '🟢 화면유지 ON';
                wakeLockBadge.style.color = '#4ade80';
                wakeLockBadge.style.borderColor = '#166534';
                console.log('✅ [NoSleep] 화면유지 활성화');
            }).catch(err => {
                wakeLockBadge.textContent = '🔴 화면유지 실패';
                wakeLockBadge.style.color = '#f87171';
                wakeLockBadge.style.borderColor = '#7f1d1d';
                console.warn('[NoSleep] 실패:', err.message);
            });
        };

        // 브라우저 자동재생 정책: 반드시 사용자 인터랙션 후 활성화
        // TV모드는 터치/클릭이 들어올 일이 없으므로 즉시 시도 (실패해도 무해 — 모니터는
        // 태블릿과 달리 OS 절전이 아니라 자체 전원설정을 따르는 경우가 대부분)
        if (isTvMode) {
            enableNoSleep();
        } else {
            wakeLockBadge.textContent = '⏳ 화면유지 대기 (터치)';
            document.addEventListener('touchstart', enableNoSleep, { once: true });
            document.addEventListener('click', enableNoSleep, { once: true });
        }

        // 탭 복귀 시 재활성화
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && !noSleepEnabled) {
                enableNoSleep();
            }
        });
    </script>
</body>
</html>
